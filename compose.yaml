services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DEX_LOOKUP_ENABLED: ${DEX_LOOKUP_ENABLED:-false}
      DEX_LOOKUP_MAX_REQUESTS: ${DEX_LOOKUP_MAX_REQUESTS:-100}
      DEX_LOOKUP_DAILY_REQUESTS: ${DEX_LOOKUP_DAILY_REQUESTS:-100}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    environment:
      RADAR_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  collector:
    build: .
    command: ["python", "-m", "mochex_radar.collector"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  streamer:
    build: .
    command: ["python", "-m", "mochex_radar.websocket_feed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dex-scanner:
    profiles: ["dex"]
    build: .
    command: ["python", "-m", "mochex_radar.dex_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DEX_LOOKUP_DAILY_REQUESTS: ${DEX_LOOKUP_DAILY_REQUESTS:-100}
      DEX_SCAN_INTERVAL_SECONDS: ${DEX_SCAN_INTERVAL_SECONDS:-900}
      DEX_WATCHLIST_PATH: /config/dex-watchlist.json
    volumes:
      - ./config/dex-watchlist.json:/config/dex-watchlist.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "on-failure:3"

volumes:
  postgres_data:
